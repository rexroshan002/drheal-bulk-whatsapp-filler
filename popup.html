<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --brand-red: #b91c1c;
        --brand-red-dark: #7f1d1d;
        --brand-soft: #fef2f2;
        --brand-border: #fecaca;
        --bg-canvas: #f8fafc;
        --card-bg: #ffffff;
        --border-subtle: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --code-bg: #0f172a;
        --code-text: #e2e8f0;
        --success: #059669;
      }

      * {
        box-sizing: border-box;
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.45);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(185, 28, 28, 0.75);
      }

      body {
        width: 440px;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-canvas);
        color: var(--text-main);
      }

      /* Header */
      .header {
        background: linear-gradient(
          135deg,
          #450a0a 0%,
          #991b1b 55%,
          #b91c1c 100%
        );
        color: #ffffff;
        padding: 11px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(127, 29, 29, 0.22);
      }
      .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo-wrap {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        overflow: hidden;
        border: 1.5px solid rgba(251, 191, 36, 0.65);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.28s ease;
        flex-shrink: 0;
      }
      .logo-wrap:hover {
        transform: scale(1.12) rotate(-5deg);
        box-shadow: 0 4px 12px rgba(251, 191, 36, 0.45);
      }
      .logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .header-text {
        display: flex;
        flex-direction: column;
      }
      .header-title {
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .header-sub {
        font-size: 10px;
        color: #fecaca;
        font-weight: 500;
      }
      .header-badge {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }

      /* Service Mode Switcher */
      .service-tabs {
        display: flex;
        background: #e2e8f0;
        padding: 3px;
        margin: 10px 14px 0;
        border-radius: 8px;
        gap: 4px;
      }
      .service-tab {
        flex: 1;
        padding: 6px 8px;
        border: none;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 700;
        color: #475569;
        background: transparent;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .service-tab:hover:not(.active) {
        color: #0f172a;
      }
      .service-tab.active {
        background: #ffffff;
        color: var(--brand-red);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
      }

      .view-pane {
        display: none;
      }
      .view-pane.active {
        display: block;
      }

      /* Main Layout */
      .container {
        padding: 10px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover {
        border-color: #cbd5e1;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      .col {
        flex: 1;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .select-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .select-wrapper::after {
        content: "";
        position: absolute;
        right: 10px;
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--brand-red);
        border-bottom: 2px solid var(--brand-red);
        transform: rotate(45deg) translateY(-2px);
        pointer-events: none;
        transition: transform 0.2s ease;
      }

      select,
      input[type="text"],
      textarea {
        width: 100%;
        padding: 6px 9px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-main);
        background: #ffffff;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
        padding-right: 28px;
        cursor: pointer;
        background-image: linear-gradient(to bottom, #ffffff, #f8fafc);
      }
      textarea.excel-paste {
        height: 88px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        resize: vertical;
        white-space: pre;
      }
      select:focus,
      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: var(--brand-red);
        box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
      }

      /* Slot Selector */
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 7px;
      }
      .section-header label {
        margin-bottom: 0;
        color: var(--text-main);
      }
      .pill-btn {
        background: var(--brand-soft);
        color: var(--brand-red);
        border: 1px solid var(--brand-border);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .pill-btn:hover {
        background: var(--brand-red);
        color: #ffffff;
        border-color: var(--brand-red);
      }

      .slots-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        max-height: 115px;
        overflow-y: auto;
        padding: 2px;
      }
      .slot-checkbox-card {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 7px;
        border: 1px solid var(--border-subtle);
        border-radius: 7px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-main);
        background: #f8fafc;
        cursor: pointer;
        user-select: none;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background-color 0.16s ease;
      }
      .slot-checkbox-card:hover {
        transform: translateY(-1px);
        border-color: #fca5a5;
        background: #ffffff;
      }
      .slot-checkbox-card.active {
        background: var(--brand-soft);
        border-color: var(--brand-red);
        color: var(--brand-red-dark);
        font-weight: 600;
      }
      .slot-checkbox-card input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin: 0;
        border: 1.5px solid #94a3b8;
        border-radius: 4px;
        background: #ffffff;
        display: grid;
        place-content: center;
        flex-shrink: 0;
      }
      .slot-checkbox-card input[type="checkbox"]:checked {
        background: var(--brand-red);
        border-color: var(--brand-red);
      }
      .slot-checkbox-card input[type="checkbox"]:checked::before {
        content: "";
        width: 7px;
        height: 4px;
        border-left: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        transform: rotate(-45deg) translate(0.5px, -0.5px);
      }

      /* Preview Card */
      .preview-card {
        background: var(--code-bg);
        color: var(--code-text);
        border-radius: 10px;
        padding: 10px 12px;
        border: 1px solid #1e293b;
      }
      .preview-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .preview-label {
        font-size: 11px;
        font-weight: 700;
        color: #fca5a5;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .mode-toggle {
        display: flex;
        background: #1e293b;
        border-radius: 6px;
        padding: 2px;
      }
      .mode-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .mode-btn.active {
        background: var(--brand-red);
        color: #ffffff;
      }

      .preview-scroll {
        max-height: 140px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding-right: 3px;
      }
      .preview-block {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 7px;
        padding: 7px 9px;
      }
      .preview-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        padding-bottom: 4px;
        border-bottom: 1px solid #334155;
      }
      .tab-badge {
        font-size: 10px;
        font-weight: 700;
        color: #fbbf24;
      }
      .tab-title-text {
        font-size: 11px;
        font-weight: 600;
        color: #f8fafc;
      }
      .json-code {
        margin: 0;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 10.5px;
        line-height: 1.4;
        color: #a7f3d0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* Buttons */
      .actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        flex: 1;
        padding: 9px 12px;
        border: none;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          opacity 0.15s ease;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-1.5px);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(185, 28, 28, 0.25);
      }
      .btn-secondary {
        background: #0f172a;
        color: #ffffff;
      }

      .status-bar {
        font-size: 11px;
        font-weight: 600;
        color: var(--success);
        text-align: center;
        min-height: 15px;
        padding-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand-group">
        <div class="logo-wrap" title="REX Form Assistant">
          <img src="logo.jpg" alt="REX Logo" />
        </div>
        <div class="header-text">
          <div class="header-title">Dr. Heal Bulk Filler</div>
          <div class="header-sub">REX Automation Assistant</div>
        </div>
      </div>
      <div class="header-badge" id="selectedCountBadge">1 Slot Selected</div>
    </div>

    <!-- Top Service Mode Switcher -->
    <div class="service-tabs">
      <button type="button" class="service-tab active" data-target="commonPane">
        1. Common (Multi-Tab)
      </button>
      <button type="button" class="service-tab" data-target="uniquePane">
        2. Unique Token (Excel Rows)
      </button>
    </div>

    <!-- SERVICE 1: COMMON VARIABLE MULTI-TAB FILLER -->
    <div id="commonPane" class="view-pane active">
      <div class="container">
        <div class="card">
          <div class="row">
            <div class="col">
              <label for="branch">Branch</label>
              <div class="select-wrapper">
                <select id="branch">
                  <option value="HSR">HSR Layout</option>
                  <option value="BSK">Banashankari (BSK)</option>
                </select>
              </div>
            </div>
            <div class="col">
              <label for="category">Template Type</label>
              <div class="select-wrapper">
                <select id="category">
                  <option value="first_en">1st Visit - English</option>
                  <option value="first_kn">1st Visit - Kannada</option>
                  <option value="followup">Follow-up (Senior Drs)</option>
                  <option value="fcfs_en">FCFS - English</option>
                  <option value="fcfs_kn">FCFS - Kannada</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <label for="dateEn">Date (EN: DD-MM-YYYY)</label>
              <input type="text" id="dateEn" />
            </div>
            <div class="col">
              <label for="dateKn">Date (KN)</label>
              <input type="text" id="dateKn" />
            </div>
          </div>

          <div class="row">
            <div class="col">
              <label for="templateName">Template Name</label>
              <input type="text" id="templateName" />
            </div>
            <div class="col" style="max-width: 110px">
              <label for="variableType">Variable Type</label>
              <input type="text" id="variableType" value="Common" />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-header">
            <label>Time Slots (1 slot per tab in current window)</label>
            <button type="button" id="toggleAllSlots" class="pill-btn">
              Select All
            </button>
          </div>
          <div class="slots-grid" id="slotsContainer"></div>
        </div>

        <div class="preview-card">
          <div class="preview-top">
            <span class="preview-label">Payload Preview</span>
            <div class="mode-toggle">
              <button type="button" class="mode-btn active" id="modeSingle">
                Single Tab (1st)
              </button>
              <button type="button" class="mode-btn" id="modeMulti">
                All Selected Tabs
              </button>
            </div>
          </div>
          <div class="preview-scroll" id="previewContainer"></div>
        </div>

        <div class="actions">
          <button id="fillCurrent" class="btn btn-primary">
            Fill Current Tab
          </button>
          <button id="fillAll" class="btn btn-secondary">
            Fill Window Tabs
          </button>
        </div>
      </div>
    </div>

    <!-- SERVICE 2: UNIQUE TOKEN & MOBILE RECIPIENT TABLE FILLER -->
    <div id="uniquePane" class="view-pane">
      <div class="container">
        <div class="card">
          <div class="row">
            <div class="col">
              <label for="uBranch">Branch</label>
              <div class="select-wrapper">
                <select id="uBranch">
                  <option value="HSR">HSR Layout</option>
                  <option value="BSK">Banashankari (BSK)</option>
                </select>
              </div>
            </div>
            <div class="col">
              <label for="uDate">Appointment Date</label>
              <input type="text" id="uDate" />
            </div>
          </div>

          <div class="row">
            <div class="col">
              <label for="uDoctor">Doctor Name ("1")</label>
              <input
                type="text"
                id="uDoctor"
                value="DR. RAKESH H JAYAPRAKASH "
              />
            </div>
            <div class="col" style="max-width: 145px">
              <label for="uTemplate">Template Name</label>
              <input type="text" id="uTemplate" value="followup_short-" />
            </div>
          </div>

          <div class="row">
            <div class="col">
              <label for="uTitle">Form Title</label>
              <input
                type="text"
                id="uTitle"
                value="HSR - DR. RAKESH H JAYAPRAKASH"
              />
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-header">
            <label for="excelPaste"
              >Paste Excel Rows (Time | Token No | Mobile)</label
            >
            <button type="button" id="clearPaste" class="pill-btn">
              Clear
            </button>
          </div>
          <textarea
            id="excelPaste"
            class="excel-paste"
            placeholder="11:30:00	23	8197785900&#10;12:30:00	29	7259192309"
          ></textarea>
        </div>

        <div class="preview-card">
          <div class="preview-top">
            <span class="preview-label">Recipient Rows Preview</span>
            <span class="tab-badge" id="uRowCount">0 Rows Ready</span>
          </div>
          <div class="preview-scroll" id="uPreviewContainer"></div>
        </div>

        <div class="actions">
          <button id="fillUniqueCurrent" class="btn btn-primary">
            Fill Recipients in Current Tab
          </button>
        </div>
      </div>
    </div>

    <div class="status-bar" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
